<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header>
        <h1>Formulario de registro</h1>
    </header>
    <main>
        <h1>CREA UNA CUENTA</h1>
        <section>
            <form action="">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Nombre">
                </div>

                <div>
                    <label for="apellidos">Apellidos</label>
                    <input type="text" name="apellidos" id="apellidos" placeholder="Apellidos">
                </div>

                <div>
                    <label for="dni">DNI</label>
                    <input type="text" name="dni" id="dni" placeholder="DNI">
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" name="telefono" id="telefono" placeholder="Teléfono">
                </div>

                <div class="campo completo">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email">
                </div>

                <div>
                    <label for="contraseña">Contraseña</label>
                    <input type="password" name="contraseña" id="contraseña">
                </div>

                <div>
                    <label for="repetirContraseña">Repetir contraseña</label>
                    <input type="password" name="repetirContraseña" id="repetirContraseña">
                </div>

                <input type="submit" value="Registrar" class="completo">

                <p class="completo">¿Ya tienes una cuenta? <a href="#">Accede aquí</a></p>
            </form>
        </section>
    </main>
</body>

</html>
